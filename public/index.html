<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialApp — Sign In</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <h1>✨ SocialApp</h1>
      <p>Connect with people you care about</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="login-tab">Sign In</button>
      <button class="auth-tab" id="register-tab">Create Account</button>
    </div>

    <div class="auth-form-wrapper">
      <!-- Login Form -->
      <form class="auth-form active" id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary form-submit">Sign In</button>
        <div class="form-error" id="login-error"></div>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="register-form" autocomplete="on">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="cooluser123" required minlength="3" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary form-submit">Create Account</button>
        <div class="form-error" id="register-error"></div>
      </form>
    </div>

    <div class="auth-footer">
      Demo account: <strong>demo@example.com</strong> / <strong>password123</strong>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
